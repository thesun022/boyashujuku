{% extends 'shell.html' %}
{% block title %}{{ title }}{% endblock %}
{% block workspace %}
<section id="management" data-url="{{ url_for('management.api_list', module=section) }}" data-login="{{ url_for('auth.login') }}"
         data-csrf="{{ csrf_token() }}">
  <header class="management-header">
    <div><h1>{{ title }}</h1><p id="section-description" class="management-description" hidden></p></div>
    <div id="section-actions" class="management-actions"></div>
  </header>
  <p id="section-status" class="management-status" role="status">正在读取数据…</p>
  <div id="section-notes" class="management-notes" hidden></div>
  <div id="section-before" class="management-related" hidden></div>
  <section class="panel management-records" id="section-records" aria-label="{{ title }}记录" hidden>
    <form id="section-search" class="management-search" role="search">
      <label><span>关键词</span><input name="q" type="search" class="form-control form-control-sm" maxlength="100" placeholder="搜索记录"></label>
      <div id="section-filters" class="management-filters"></div>
      <button class="btn btn-primary btn-sm" type="submit">查询</button>
    </form>
    <div id="section-results"></div>
    <div id="section-pagination" class="records-pages"></div>
  </section>
  <div id="section-related" class="management-related"></div>
  <dialog id="operation-dialog" class="operation-dialog" aria-labelledby="operation-title">
    <form id="operation-form">
      <header><h2 id="operation-title"></h2><button class="btn-close" id="operation-close" type="button" aria-label="关闭"></button></header>
      <div id="operation-fields"></div>
      <p id="operation-error" class="operation-error" role="alert"></p>
      <footer><button class="btn btn-outline-secondary" id="operation-cancel" type="button">取消</button>
        <button class="btn btn-primary" id="operation-submit" type="submit">保存</button></footer>
    </form>
  </dialog>
</section>
<script defer src="{{ url_for('static', filename='management.js') }}"></script>
{% endblock %}
